server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: freelancehub-backend
  profiles:
    active: h2
  datasource:
    url: jdbc:h2:mem:freelancehub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

# JWT & Security Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
  payment:
    stripe:
      publishable-key: pk_test_freelancehub3d_sample_key_98234
      secret-key: sk_test_freelancehub3d_secret_key_84712
      webhook-secret: whsec_test_mock_secret
    razorpay:
      key-id: rzp_test_freelancehub3d_12345
      key-secret: rzp_sec_freelancehub3d_67890
      webhook-secret: rzp_whsec_mock_key

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.freelancehub: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
