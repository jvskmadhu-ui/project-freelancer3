version: '3.8'

services:
  # PostgreSQL Database (Optional production database)
  postgres:
    image: postgres:15-alpine
    container_name: freelancehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: freelancehub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - freelancehub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 3 Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freelancehub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: freelancehub_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_sample}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_sample}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_sample}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_sec_sample}
    ports:
      - "8080:8080"
    networks:
      - freelancehub-network

  # React + Vite + Nginx Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freelancehub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - freelancehub-network

networks:
  freelancehub-network:
    driver: bridge

volumes:
  postgres_data:
