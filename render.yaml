services:
  # 1. Spring Boot 3 Backend API
  - type: web
    name: freelancehub-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080

  # 2. React + Vite Frontend Web App
  - type: web
    name: freelancehub-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
